name: Update Predictions Daily

on:
  schedule:
    # Run at 9 AM UTC (after market open) every weekday
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Update predictions
      run: |
        python predict_tomorrow.py

    - name: Commit and push if changes
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add predictions_history.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update predictions $(date +%Y-%m-%d)" && git push)

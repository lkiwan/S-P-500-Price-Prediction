services:
  web:
    build: .
    container_name: sp500-dashboard
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./predictions_history.csv:/app/predictions_history.csv
      - ./predictions_with_accuracy.csv:/app/predictions_with_accuracy.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sp500-network

networks:
  sp500-network:
    driver: bridge
